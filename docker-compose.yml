services:
  postgres:
    image: postgres:16-alpine
    container_name: golyv-postgres
    environment:
      POSTGRES_DB: fleet_booking
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: golyv-backend
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      L5_SWAGGER_GENERATE_ALWAYS: "true"
      L5_SWAGGER_CONST_HOST: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fleet_booking
      DB_USERNAME: fleet
      DB_PASSWORD: fleet_secret
      FRONTEND_URL: http://localhost:43123
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "composer install --no-interaction &&
             php artisan config:clear &&
             php artisan key:generate --force &&
             (php artisan migrate --force || true) &&
             (php artisan l5-swagger:generate || true) &&
             php-fpm"

  nginx:
    image: nginx:1.27-alpine
    container_name: golyv-nginx
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: golyv-frontend
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "43123:43123"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx
    command: >
      sh -c "npm install &&
             npm run dev -- --hostname 0.0.0.0 --port 43123"

volumes:
  postgres_data:
  frontend_node_modules:
